name: v0.6 targeted search combination validation

on:
  push:
    paths:
      - .github/workflows/v06-targeted-search.yml
  workflow_dispatch:

jobs:
  selection:
    name: "v0.6 ${{ matrix.variant }} vs v0.5"
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - { variant: all-off, tt: "false", null: "false", aspiration: "false" }
          - { variant: tt, tt: "true", null: "false", aspiration: "false" }
          - { variant: tt-null, tt: "true", null: "true", aspiration: "false" }
          - { variant: tt-aspiration, tt: "true", null: "false", aspiration: "true" }
          - { variant: tt-null-aspiration, tt: "true", null: "true", aspiration: "true" }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile engine and validate C++/UCI tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCHESS_NATIVE=OFF -DCHESS_LTO=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Compile Fastchess
        run: |
          git clone --depth 1 https://github.com/Disservin/fastchess.git /tmp/fastchess
          make -C /tmp/fastchess -j2
      - name: 200 paired games against historical v0.5
        env:
          VARIANT: ${{ matrix.variant }}
          TT: ${{ matrix.tt }}
          NULL_VERIFY: ${{ matrix.null }}
          ASPIRATION: ${{ matrix.aspiration }}
        run: |
          python tools/strength_test.py \
            --candidate build/bitboard-chess-engine \
            --baseline-ref 9189218c76bee69c08a7e29dad12650ada2d1b13 \
            --candidate-option "All Heuristics=false" \
            --candidate-option "Clustered TT=$TT" \
            --candidate-option "Null Verification=$NULL_VERIFY" \
            --candidate-option "Adaptive Aspiration=$ASPIRATION" \
            --fastchess /tmp/fastchess/fastchess \
            --mode fixed --rounds 100 --tc 3+0.03 --concurrency 2 \
            --hash 16 --seed 20261104 --out "results/$VARIANT"
      - name: Save full PGN, logs and option hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: targeted-${{ matrix.variant }}
          path: results/
          if-no-files-found: warn
