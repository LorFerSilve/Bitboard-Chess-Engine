name: v0.6 TT and aspiration independent confirmation

on:
  push:
    paths:
      - .github/workflows/v06-confirm-tt-aspiration.yml
  workflow_dispatch:

jobs:
  confirmation:
    name: 400-game TT + aspiration versus historical v0.5
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build candidate and run regression tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCHESS_NATIVE=OFF -DCHESS_LTO=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Build Fastchess
        run: |
          git clone --depth 1 https://github.com/Disservin/fastchess.git /tmp/fastchess
          make -C /tmp/fastchess -j2
      - name: Confirm selected combination in 400 color-paired games
        run: |
          python tools/strength_test.py \
            --candidate build/bitboard-chess-engine \
            --baseline-ref 9189218c76bee69c08a7e29dad12650ada2d1b13 \
            --candidate-option "All Heuristics=false" \
            --candidate-option "Clustered TT=true" \
            --candidate-option "Adaptive Aspiration=true" \
            --fastchess /tmp/fastchess/fastchess \
            --mode fixed --rounds 200 --tc 3+0.03 --concurrency 2 \
            --hash 16 --seed 20261105 --out results/tt-aspiration-confirm
      - name: Preserve games, configuration and match result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v06-tt-aspiration-400-games
          path: results/
          if-no-files-found: warn
