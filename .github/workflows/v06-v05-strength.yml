name: v0.6 candidate vs v0.5 paired Elo match

on:
  push:
    paths:
      - .github/workflows/v06-v05-strength.yml
  workflow_dispatch:

jobs:
  elo:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build candidate v0.6
        run: |
          cmake -S . -B build-candidate -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCHESS_NATIVE=OFF -DCHESS_LTO=ON
          cmake --build build-candidate --parallel 2
      - name: Build fastchess
        run: |
          git clone --depth 1 https://github.com/Disservin/fastchess.git /tmp/fastchess
          make -C /tmp/fastchess -j2
      - name: Play paired 200-game comparison
        run: |
          mkdir -p results
          printf 'Candidate: %s\nBaseline: %s\nFastchess: %s\nCPU: %s\n' \
            "$(git rev-parse HEAD)" "9189218c76bee69c08a7e29dad12650ada2d1b13" \
            "$(git -C /tmp/fastchess rev-parse HEAD)" "$(lscpu | grep 'Model name' | head -1)" \
            | tee results/environment.txt
          python tools/strength_test.py \
            --candidate build-candidate/bitboard-chess-engine \
            --baseline-ref 9189218c76bee69c08a7e29dad12650ada2d1b13 \
            --fastchess /tmp/fastchess/fastchess \
            --mode fixed --rounds 100 --tc 3+0.03 \
            --concurrency 2 --hash 16 --seed 20261031 \
            --out results/v06-v05-200games
      - name: Preserve logs and PGNs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v06-v05-200games
          path: results/
          if-no-files-found: warn
