name: Build and test
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  syzygy_compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure with Fathom
        run: cmake -S . -B build-syzygy -DCMAKE_BUILD_TYPE=Release -DCHESS_SYZYGY=ON
      - name: Build
        run: cmake --build build-syzygy --config Release --parallel 2
      - name: Test without external tablebase data
        run: ctest --test-dir build-syzygy -C Release --output-on-failure
