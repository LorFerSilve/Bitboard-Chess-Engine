name: v0.6 combination selection versus v0.5

on:
  push:
    paths:
      - .github/workflows/v06-combinations.yml

jobs:
  combinations:
    name: "v0.6 ${{ matrix.variant }} versus v0.5"
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - variant: king
            king: "true"
            forks: "false"
            cluster: "false"
            aspiration: "false"
          - variant: king-forks
            king: "true"
            forks: "true"
            cluster: "false"
            aspiration: "false"
          - variant: king-forks-tt
            king: "true"
            forks: "true"
            cluster: "true"
            aspiration: "false"
          - variant: king-forks-tt-aspiration
            king: "true"
            forks: "true"
            cluster: "true"
            aspiration: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build candidate
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCHESS_NATIVE=OFF -DCHESS_LTO=ON
          cmake --build build --parallel 2
      - name: Build Fastchess
        run: |
          git clone --depth 1 https://github.com/Disservin/fastchess.git /tmp/fastchess
          make -C /tmp/fastchess -j2
      - name: Play paired candidate v0.6 versus unchanged v0.5
        env:
          VARIANT: ${{ matrix.variant }}
          KING: ${{ matrix.king }}
          FORKS: ${{ matrix.forks }}
          CLUSTER: ${{ matrix.cluster }}
          ASPIRATION: ${{ matrix.aspiration }}
        run: |
          python tools/strength_test.py \
            --candidate build/bitboard-chess-engine \
            --baseline-ref 9189218c76bee69c08a7e29dad12650ada2d1b13 \
            --candidate-option "All Heuristics=false" \
            --candidate-option "King Pressure=$KING" \
            --candidate-option "Knight Forks=$FORKS" \
            --candidate-option "Clustered TT=$CLUSTER" \
            --candidate-option "Adaptive Aspiration=$ASPIRATION" \
            --fastchess /tmp/fastchess/fastchess \
            --mode fixed --rounds 100 --tc 3+0.03 --concurrency 2 \
            --hash 16 --seed 20261102 \
            --out "results/$VARIANT"
      - name: Preserve game logs and exact options
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combination-${{ matrix.variant }}
          path: results/
          if-no-files-found: warn
