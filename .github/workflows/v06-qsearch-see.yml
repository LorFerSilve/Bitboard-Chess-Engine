name: v0.6 qsearch SEE ablation and v0.5 comparison

on:
  push:
    paths:
      - .github/workflows/v06-qsearch-see.yml
  workflow_dispatch:

jobs:
  experiments:
    name: QSearch SEE pruning - two controlled matches
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build release engine and run tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCHESS_NATIVE=OFF -DCHESS_LTO=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Build Fastchess
        run: |
          git clone --depth 1 https://github.com/Disservin/fastchess.git /tmp/fastchess
          make -C /tmp/fastchess -j2
      - name: Isolated qsearch SEE experiment (same binary on both sides)
        run: |
          python tools/strength_test.py \
            --candidate build/bitboard-chess-engine \
            --baseline build/bitboard-chess-engine \
            --candidate-option "All Heuristics=false" \
            --candidate-option "QSearch SEE Pruning=true" \
            --baseline-option "All Heuristics=false" \
            --fastchess /tmp/fastchess/fastchess \
            --mode fixed --rounds 100 --tc 3+0.03 --concurrency 2 \
            --hash 16 --seed 20261106 --out results/qsearch-isolated
      - name: Qsearch SEE only compared with unchanged historical v0.5
        run: |
          python tools/strength_test.py \
            --candidate build/bitboard-chess-engine \
            --baseline-ref 9189218c76bee69c08a7e29dad12650ada2d1b13 \
            --candidate-option "All Heuristics=false" \
            --candidate-option "QSearch SEE Pruning=true" \
            --fastchess /tmp/fastchess/fastchess \
            --mode fixed --rounds 100 --tc 3+0.03 --concurrency 2 \
            --hash 16 --seed 20261107 --out results/qsearch-v05
      - name: Upload PGNs, Fastchess logs, UCI options and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v06-qsearch-see-tests
          path: results/
          if-no-files-found: warn
